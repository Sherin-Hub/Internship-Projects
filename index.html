<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Interactive Image Gallery</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1> My Interactive Image Gallery </h1>

  <!-- FILTER BUTTONS -->

  <div class="buttons">

    <button onclick="showCategory('all')">
      All
    </button>

    <button onclick="showCategory('aesthetic')">
      Aesthetic
    </button>

    <button onclick="showCategory('landscape')">
      Landscape
    </button>

    <button onclick="showCategory('nature')">
      Nature
    </button>

    <button onclick="showCategory('beach')">
      Beach
    </button>

  </div>

  <!-- QUOTES -->

  <div id="quote" class="quote">

    ✨ Explore beautiful memories ✨

  </div>

  <!-- GALLERY -->

  <div class="gallery">

    <!-- AESTHETIC -->

    <img src="https://upload.wikimedia.org/wikipedia/commons/f/fc/Aesthetic-4886533_1280.jpg?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original"
         class="filter aesthetic"
         alt="Aesthetic 1">

    <img src="https://plus.unsplash.com/premium_photo-1673285285994-6bfff235db97?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8bmF0dXJlJTIwYWVzdGhldGljfGVufDB8fDB8fHww"
         class="filter aesthetic"
         alt="Aesthetic 2">

    <img src="https://i.pinimg.com/originals/7e/04/49/7e0449656995369dea3809f2afa60ad8.jpg"
         class="filter aesthetic"
         alt="Aesthetic 3">

    <!-- LANDSCAPE -->

    <img src="https://upload.wikimedia.org/wikipedia/commons/c/c0/Mountain_landscape_4432242.jpg"
         class="filter landscape"
         alt="Landscape 1">

    <img src="https://thumbs.dreamstime.com/b/landscape-sunset-view-morain-lake-mountain-range-alberta-canada-44613434.jpg"
         class="filter landscape"
         alt="Landscape 2">

    <img src="https://i.pinimg.com/1200x/ee/4e/52/ee4e5298eced9606f8b5092c3fba30ee.jpg"
         class="filter landscape"
         alt="Landscape 3">

    <img src="https://img.magnific.com/free-photo/reflection-photo-trees-mountain_395237-233.jpg?semt=ais_hybrid&w=740&q=80"
         class="filter landscape"
         alt="Landscape 4">

    <!-- NATURE -->

    <img src="https://media.istockphoto.com/id/1317323736/photo/a-view-up-into-the-trees-direction-sky.jpg?s=612x612&w=0&k=20&c=i4HYO7xhao7CkGy7Zc_8XSNX_iqG0vAwNsrH1ERmw2Q="
         class="filter nature"
         alt="Nature 1">

    <img src="https://t4.ftcdn.net/jpg/10/15/52/23/360_F_1015522373_Q34xhiDaoR3WzDMQTGYB43RV7BTYYmLC.jpg"
         class="filter nature"
         alt="Nature 2">

    <img src="https://images5.alphacoders.com/336/thumb-1920-336625.jpg"
         class="filter nature"
         alt="Nature 3">

    <img src="https://www.godigit.com/content/dam/godigit/directportal/en/contenthm/top-12-bird-sanctuaries-to-visit-in-rajasthan.jpg"
         class="filter nature"
         alt="Nature 4">

    <!-- BEACH -->

    <img src="https://i.pinimg.com/736x/08/6c/cf/086ccf79e4ba99cdedee98595f9104b7.jpg"
         class="filter beach"
         alt="Beach 1">

    <img src="https://media.istockphoto.com/id/2096604238/photo/aerial-beach-and-coconut-trees-on-a-calm-island-in-the-morning.jpg?s=612x612&w=0&k=20&c=rKCfLsfiOxaImi1ywObtJ8g_sJ_jqS0bboPMhHDYXDM="
         class="filter beach"
         alt="Beach 2">

    <img src="https://media.timeout.com/images/105873212/750/562/image.jpg"
         class="filter beach"
         alt="Beach 3">

    <img src="https://i.pinimg.com/736x/77/6b/87/776b87ac50d5f21b6794a7fec9855985.jpg"
         class="filter beach"
         alt="Beach 4">

  </div>

  <!-- LIGHTBOX -->

  <div id="lightbox" class="lightbox">

    <span class="close">&times;</span>

    <img class="lightbox-img"
         src=""
         alt="">

    <div class="controls">

      <button id="prev">
        ⟨ Prev
      </button>

      <button id="next">
        Next ⟩
      </button>

    </div>

  </div>

  <script src="script.js"></script>

</body>

</html>
