<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Interactive Image Gallery</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1> My Interactive Image Gallery </h1>

  <!-- FILTER BUTTONS -->

  <div class="buttons">

    <button onclick="showCategory('all')">
      All
    </button>

    <button onclick="showCategory('aesthetic')">
      Aesthetic
    </button>

    <button onclick="showCategory('landscape')">
      Landscape
    </button>

    <button onclick="showCategory('nature')">
      Nature
    </button>

    <button onclick="showCategory('beach')">
      Beach
    </button>

  </div>

  <!-- QUOTES -->

  <div id="quote" class="quote">

    ✨ Explore beautiful memories ✨

  </div>

  <!-- GALLERY -->

  <div class="gallery">

    <!-- AESTHETIC -->

    <img src="images/Asthetic1.avif"
         class="filter aesthetic"
         alt="Aesthetic 1">

    <img src="images/Asthetic2.avif"
         class="filter aesthetic"
         alt="Aesthetic 2">

    <img src="images/Asthetic3.avif"
         class="filter aesthetic"
         alt="Aesthetic 3">

    <!-- LANDSCAPE -->

    <img src="images/landscape-1.avif"
         class="filter landscape"
         alt="Landscape 1">

    <img src="images/landscape-2.avif"
         class="filter landscape"
         alt="Landscape 2">

    <img src="images/landscape-3.avif"
         class="filter landscape"
         alt="Landscape 3">

    <img src="images/landscape-4.avif"
         class="filter landscape"
         alt="Landscape 4">

    <!-- NATURE -->

    <img src="images/nature1.avif"
         class="filter nature"
         alt="Nature 1">

    <img src="images/nature2.avif"
         class="filter nature"
         alt="Nature 2">

    <img src="images/nature3.avif"
         class="filter nature"
         alt="Nature 3">

    <img src="images/nature4.avif"
         class="filter nature"
         alt="Nature 4">

    <!-- BEACH -->

    <img src="images/photo3.avif"
         class="filter beach"
         alt="Beach 1">

    <img src="images/photo4.avif"
         class="filter beach"
         alt="Beach 2">

    <img src="images/photo5.avif"
         class="filter beach"
         alt="Beach 3">

    <img src="images/photo6.avif"
         class="filter beach"
         alt="Beach 4">

  </div>

  <!-- LIGHTBOX -->

  <div id="lightbox" class="lightbox">

    <span class="close">&times;</span>

    <img class="lightbox-img"
         src=""
         alt="">

    <div class="controls">

      <button id="prev">
        ⟨ Prev
      </button>

      <button id="next">
        Next ⟩
      </button>

    </div>

  </div>

  <script src="script.js"></script>

</body>

</html>
