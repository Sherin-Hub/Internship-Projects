<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Interactive Image Gallery</title>

  <link rel="stylesheet"
        href="style.css">

</head>

<body>

  <h1> My Interactive Image Gallery </h1>

  <!-- FILTER BUTTONS -->

  <div class="buttons">

    <button onclick="showCategory('all')">
      All
    </button>

    <button onclick="showCategory('aesthetic')">
      Aesthetic
    </button>

    <button onclick="showCategory('landscape')">
      Landscape
    </button>

    <button onclick="showCategory('nature')">
      Nature
    </button>

    <button onclick="showCategory('beach')">
      Beach
    </button>

  </div>

  <!-- QUOTE -->

  <div id="quote" class="quote">

    ✨ Explore beautiful memories ✨

  </div>

  <!-- GALLERY -->

  <div class="gallery">

    <!-- AESTHETIC -->

    <img src="https://upload.wikimedia.org/wikipedia/commons/f/fc/Aesthetic-4886533_1280.jpg"
         class="filter aesthetic"
         alt="Aesthetic 1"

         data-title="Dreamy Aesthetic"
         data-category="Aesthetic"
         data-description="A peaceful aesthetic wallpaper with dreamy vibes.">

    <img src="https://images.openai.com/static-rsc-4/pI878bMQj2b5K4F5whdi-srrQqZUO-c6wjVbkei-aS2DM3NkyvSaBmcAKnhqHhMQnThnMcJBTLWFyr2rUiElgNFBlvUF4JKAi6DgZvtzZXvD4dD0hiNzUBqY-BC9ey2xDd2nUaNNmJbL5Eqd-LjjEo5nEmLKn_R7EXIciWw8trc?purpose=inline"
         class="filter aesthetic"
         alt="Aesthetic 2"

         data-title="Purple Glow"
         data-category="Aesthetic"
         data-description="Beautiful glowing purple aesthetic scene.">

    <img src="https://plus.unsplash.com/premium_photo-1673285285994-6bfff235db97"
         class="filter aesthetic"
         alt="Aesthetic 3"

         data-title="Nature Aesthetic"
         data-category="Aesthetic"
         data-description="Beautiful aesthetic nature wallpaper.">


    <!-- LANDSCAPE -->

    <img src="https://upload.wikimedia.org/wikipedia/commons/c/c0/Mountain_landscape_4432242.jpg"
         class="filter landscape"
         alt="Landscape 1"

         data-title="Mountain View"
         data-category="Landscape"
         data-description="Beautiful mountain landscape scenery.">

    <img src="https://thumbs.dreamstime.com/b/landscape-sunset-view-morain-lake-mountain-range-alberta-canada-44613434.jpg"
         class="filter landscape"
         alt="Landscape 2"

         data-title="Sunset Lake"
         data-category="Landscape"
         data-description="Golden sunset reflecting over lake.">

    <img src="https://img.magnific.com/free-photo/reflection-photo-trees-mountain_395237-233.jpg"
         class="filter landscape"
         alt="Landscape 3"

         data-title="Nature Reflection"
         data-category="Landscape"
         data-description="Reflection of mountains in calm water.">


    <!-- NATURE -->

    <img src="https://media.istockphoto.com/id/1317323736/photo/a-view-up-into-the-trees-direction-sky.jpg"
         class="filter nature"
         alt="Nature 1"

         data-title="Green Forest"
         data-category="Nature"
         data-description="Fresh green forest under sunlight.">

    <img src="https://t4.ftcdn.net/jpg/10/15/52/23/360_F_1015522373_Q34xhiDaoR3WzDMQTGYB43RV7BTYYmLC.jpg"
         class="filter nature"
         alt="Nature 2"

         data-title="Nature Beauty"
         data-category="Nature"
         data-description="Beautiful natural scenery with trees.">

    <img src="https://images5.alphacoders.com/336/thumb-1920-336625.jpg"
         class="filter nature"
         alt="Nature 3"

         data-title="Blue Nature"
         data-category="Nature"
         data-description="Cool blue-toned peaceful nature wallpaper.">


    <!-- BEACH -->

    <img src="https://i.pinimg.com/736x/08/6c/cf/086ccf79e4ba99cdedee98595f9104b7.jpg"
         class="filter beach"
         alt="Beach 1"

         data-title="Beach Sunset"
         data-category="Beach"
         data-description="Relaxing beach sunset with soft waves.">

    <img src="https://media.istockphoto.com/id/2096604238/photo/aerial-beach-and-coconut-trees-on-a-calm-island-in-the-morning.jpg"
         class="filter beach"
         alt="Beach 2"

         data-title="Tropical Island"
         data-category="Beach"
         data-description="Aerial tropical beach island view.">

    <img src="https://media.timeout.com/images/105873212/750/562/image.jpg"
         class="filter beach"
         alt="Beach 3"

         data-title="Ocean Dreams"
         data-category="Beach"
         data-description="Ocean breeze and peaceful beach vibes.">

     <img src="https://i.pinimg.com/736x/77/6b/87/776b87ac50d5f21b6794a7fec9855985.jpg"
         class="filter beach"
         alt="Beach 4"
         
         data-title="Sea Breeze"
         data-category="Beach"
         data-description="Feel the cool sea breeze and peaceful coastal beauty.">

  </div>

  <!-- LIGHTBOX -->

  <div id="lightbox" class="lightbox">

    <span class="close">&times;</span>

    <img class="lightbox-img"
         src=""
         alt="">

    <!-- IMAGE DETAILS -->

    <div class="image-details">

      <h2 id="image-title"></h2>

      <p id="image-category"></p>

      <p id="image-description"></p>

    </div>

    <!-- CONTROLS -->

    <div class="controls">

      <button id="prev">
        ⟨ Prev
      </button>

      <button id="next">
        Next ⟩
      </button>

    </div>

  </div>

  <script src="script.js"></script>

</body>

</html>
